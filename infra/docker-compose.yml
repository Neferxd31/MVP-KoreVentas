# ═══════════════════════════════════════════════════════════════
# Solo PostgreSQL — para desarrollo manual (sin Docker completo)
# Uso: cd infra && docker compose up -d
# ═══════════════════════════════════════════════════════════════

services:
  postgres:
    image: postgres:15-alpine
    container_name: koreventas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: koreventas
      POSTGRES_USER: koreventas
      POSTGRES_PASSWORD: koreventas
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U koreventas -d koreventas"]
      interval: 5s
      timeout: 5s
      retries: 5
